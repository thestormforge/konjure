version: 2
before:
  hooks:
  - go mod tidy
  - go generate ./...
builds:
- env:
  - CGO_ENABLED=0
  goarch:
  - amd64
  - arm64
  ignore:
  - goos: linux
    goarch: arm64
archives:
- name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
  files:
  - none*
checksum:
  name_template: checksums.txt
snapshot:
  name_template: "{{ .Tag }}-next+commit.{{ .ShortCommit }}"
release:
  draft: true
  prerelease: auto
homebrew_casks:
- name: konjure
  description: Manifest appear!
  homepage: https://github.com/thestormforge/konjure/
  skip_upload: auto
  repository:
    owner: thestormforge
    name: homebrew-tap
  commit_author:
    name: grambot
    email: grambot@users.noreply.github.com
  generate_completions_from_executable:
    shell_parameter_format: cobra
    args:
    - completion
  hooks:
    post:
      install: |
        if OS.mac?
          system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/konjure"]
        end
